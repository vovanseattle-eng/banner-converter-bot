<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Выбор цвета</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    body {
      background-color: #0b0b0b;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      min-height: 100vh;
    }
    h1 {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 20px;
      color: #f5f5f5;
    }
    .preview-box {
      width: 100%;
      height: 90px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      margin-bottom: 20px;
      transition: background-color 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hex-text {
      font-family: "SF Mono", Menlo, Consolas, monospace;
      font-size: 16px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
    }
    .picker-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 100%;
      height: 52px;
      border-radius: 10px;
      cursor: pointer;
      background: none;
    }
    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }
    input[type="color"]::-webkit-color-swatch {
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
    }
    .presets-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #777777;
      margin-top: 10px;
      margin-bottom: 8px;
    }
    .presets-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .preset-btn {
      height: 44px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      cursor: pointer;
      transition: transform 0.1s ease, border-color 0.2s ease;
    }
    .preset-btn:active {
      transform: scale(0.96);
    }
    .apply-btn {
      width: 100%;
      height: 48px;
      margin-top: 24px;
      background: #ffffff;
      color: #000000;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }
    .apply-btn:active {
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <h1>Выбор цвета</h1>

  <div class="preview-box" id="previewBox">
    <span class="hex-text" id="hexDisplay">#FFFFFF</span>
  </div>

  <div class="picker-container">
    <input type="color" id="nativePicker" value="#FFFFFF">

    <div class="presets-title">Быстрые оттенки</div>
    <div class="presets-grid">
      <div class="preset-btn" style="background:#000000;" onclick="selectHex('#000000')"></div>
      <div class="preset-btn" style="background:#141414;" onclick="selectHex('#141414')"></div>
      <div class="preset-btn" style="background:#222222;" onclick="selectHex('#222222')"></div>
      <div class="preset-btn" style="background:#333333;" onclick="selectHex('#333333')"></div>
      <div class="preset-btn" style="background:#666666;" onclick="selectHex('#666666')"></div>
      <div class="preset-btn" style="background:#A3A3A3;" onclick="selectHex('#A3A3A3')"></div>
      <div class="preset-btn" style="background:#F2E9E4;" onclick="selectHex('#F2E9E4')"></div>
      <div class="preset-btn" style="background:#FFFFFF;" onclick="selectHex('#FFFFFF')"></div>
    </div>

    <button class="apply-btn" id="applyBtn" onclick="applyColor()">Применить цвет</button>
  </div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    let currentHex = "#FFFFFF";

    const nativePicker = document.getElementById("nativePicker");
    const previewBox = document.getElementById("previewBox");
    const hexDisplay = document.getElementById("hexDisplay");

    function updateColor(hex) {
      currentHex = hex.toUpperCase();
      nativePicker.value = currentHex;
      previewBox.style.backgroundColor = currentHex;
      hexDisplay.textContent = currentHex;
      if (currentHex === "#FFFFFF" || currentHex === "#F2E9E4" || currentHex === "#A3A3A3") {
        hexDisplay.style.color = "#000000";
        hexDisplay.style.backgroundColor = "rgba(255, 255, 255, 0.7)";
      } else {
        hexDisplay.style.color = "#ffffff";
        hexDisplay.style.backgroundColor = "rgba(0, 0, 0, 0.6)";
      }
    }

    nativePicker.addEventListener("input", (e) => {
      updateColor(e.target.value);
    });

    function selectHex(hex) {
      updateColor(hex);
    }

    function applyColor() {
      const cleanHex = currentHex.replace("#", "");
      if (tg && tg.sendData) {
        tg.sendData(cleanHex);
      } else {
        alert("Выбран цвет: #" + cleanHex);
      }
    }

    updateColor("#FFFFFF");
  </script>
</body>
</html>
